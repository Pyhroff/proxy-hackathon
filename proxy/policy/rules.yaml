# Declarative security policy for the Proxy agent.
#
# Why YAML instead of hardcoded Python: anyone on the team (or a judge
# skimming the repo) can see and change what the agent is allowed to do
# without touching the gate's logic. This file IS the allowlist — code
# never grants permission on its own, it only reads permission from here.
#
# Default-deny principle: an action type or domain not listed below is
# denied, not allowed. See policy/rules_loader.py's get_action_rule().

allowed_domains:
  - "benefits-demo.local"
  # Add real demo-site domains here as Person 4 stands them up.
  # NEVER add a real production/government site here — see the
  # architecture doc's scope guardrails.
  #
  # SCOPE DECISION (see THREAT_MODEL.md "Session/Account Scope Decision"):
  # only add domains here for no-account or create-your-own-account form
  # flows (Category A/B). NEVER add a domain the agent would operate
  # inside an existing signed-in session on (Category C — Gmail, Drive,
  # Calendar, payment accounts, etc.) — credential/session attacks are
  # explicitly out of scope for this project's threat model, and this
  # allowlist is the one place that decision is actually enforced, not
  # just documented.

actions:
  click:
    allowed: true

  type:
    allowed: true

  read_page:
    allowed: true

  scroll:
    allowed: true

  wait:
    allowed: true

  navigate:
    allowed: true
    constraint: "same_domain_only"

  submit:
    allowed: true
    requires_human_review: true   # highest-consequence action: always pause for a human

  ask_human:
    allowed: true

  # Anything not listed here (e.g. "delete", "download", "navigate_external")
  # is denied by default via get_action_rule()'s fallback.
